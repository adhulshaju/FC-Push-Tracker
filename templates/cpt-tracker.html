<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090e">
<title>CPT Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07090e; --s1:#0c1119; --s2:#10161f;
  --border:#182030; --muted:#3d5470; --text:#b8cce0; --white:#eef5ff;
  --safe:#22c55e; --warn:#f59e0b; --crit:#ef4444; --blue:#60a5fa; --done:#2a3d52;
  --safe-bg:rgba(34,197,94,.07); --warn-bg:rgba(245,158,11,.09); --crit-bg:rgba(239,68,68,.09);
  --safe-bd:rgba(34,197,94,.28); --warn-bd:rgba(245,158,11,.35); --crit-bd:rgba(239,68,68,.38);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--text);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;overscroll-behavior:none;-webkit-overflow-scrolling:touch;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(rgba(96,165,250,.016) 1px,transparent 1px),
             linear-gradient(90deg,rgba(96,165,250,.016) 1px,transparent 1px);
  background-size:38px 38px;
}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-bottom:60px}

/* ── HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0}
.logo{font-family:'Bebas Neue';font-size:20px;letter-spacing:5px;color:var(--white)}
.logo b{color:var(--warn)}
.shift-pill{font-size:8px;letter-spacing:2px;color:var(--muted);background:var(--s2);border:1px solid var(--border);padding:4px 10px;border-radius:4px;text-transform:uppercase}

/* ── CLOCK */
.clock-wrap{text-align:center;padding:12px 16px 6px}
.clock{font-family:'Bebas Neue';font-size:66px;letter-spacing:4px;line-height:1;color:var(--white)}
.clock-date{font-size:8px;letter-spacing:3px;color:var(--muted);margin-top:2px;text-transform:uppercase}

/* ── NOTIFY BTN */
.notify-btn{display:flex;align-items:center;justify-content:center;gap:7px;margin:8px 14px;padding:11px;background:var(--s1);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:calc(100% - 28px);transition:all .2s}
.notify-btn:active{transform:scale(.98)}
.notify-btn.on{border-color:var(--safe-bd);color:var(--safe);background:var(--safe-bg)}

/* ── SECTION HEADER */
.sec-hdr{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:8px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── ACTIVE GRID */
.active-grid{padding:0 12px;display:flex;flex-direction:column;gap:8px}
.dual-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── ACTIVE CARD */
.act-card{border-radius:16px;padding:16px;border:1.5px solid transparent;position:relative;overflow:hidden;transition:border-color .4s,background .4s}
.act-card.warn-card{background:var(--warn-bg);border-color:var(--warn-bd)}
.act-card.crit-card{background:var(--crit-bg);border-color:var(--crit-bd)}
.single-card{padding:20px}
.single-card .big-cd{font-family:'Bebas Neue';font-size:68px;letter-spacing:3px;line-height:1;margin:6px 0 4px}
.single-card.warn-card .big-cd{color:var(--warn)}
.single-card.crit-card .big-cd{color:var(--crit);animation:glow-crit .7s infinite}
@keyframes glow-crit{0%,100%{opacity:1}50%{opacity:.7}}
.dual-card{padding:14px}
.dual-card .big-cd{font-family:'Bebas Neue';font-size:38px;letter-spacing:2px;line-height:1;margin:4px 0 3px}
.dual-card.warn-card .big-cd{color:var(--warn)}
.dual-card.crit-card .big-cd{color:var(--crit);animation:glow-crit .7s infinite}
.phase-tag{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 9px;border-radius:20px;margin-bottom:10px}
.warn-card .phase-tag{background:rgba(245,158,11,.2);color:var(--warn)}
.crit-card .phase-tag{background:rgba(239,68,68,.22);color:var(--crit);animation:tag-blink .8s infinite}
@keyframes tag-blink{0%,100%{opacity:1}50%{opacity:.5}}
.act-lbl{font-size:8px;letter-spacing:1.5px;color:var(--muted);margin-bottom:1px}
.act-cpt-t{font-family:'Bebas Neue';font-size:28px;letter-spacing:2px;line-height:1;margin-bottom:2px}
.warn-card .act-cpt-t{color:var(--warn)}
.crit-card .act-cpt-t{color:var(--crit)}
.cd-sub{font-size:9px;color:var(--muted);margin-bottom:10px}
.prog-wrap{height:3px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden;margin-bottom:12px}
.prog-bar{height:100%;border-radius:2px;transition:width 1s linear}
.warn-card .prog-bar{background:var(--warn)}
.crit-card .prog-bar{background:var(--crit)}
.mini-phases{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.mini-ph{display:flex;align-items:center;gap:6px}
.mini-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.mini-t{font-size:10px;font-weight:500;color:var(--text);min-width:36px}
.mini-desc{font-size:9px;color:var(--muted)}
.dual-card .mini-desc{display:none}
.dual-card .mini-ph{gap:5px}
.dual-card .mini-t{font-size:9px;min-width:32px}
.dual-card .mini-phases{margin-bottom:10px}
.done-btn{width:100%;padding:10px;border-radius:10px;background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.35);color:var(--crit);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.done-btn:active{transform:scale(.97);background:rgba(239,68,68,.28)}

/* ── NEXT CARD */
.next-card{margin:0 12px;background:var(--s1);border:1px solid rgba(96,165,250,.28);border-radius:16px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}
.nc-left .nc-lbl{font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:2px}
.nc-left .nc-time{font-family:'Bebas Neue';font-size:44px;letter-spacing:3px;color:var(--blue);line-height:1}
.nc-left .nc-push{font-size:9px;color:var(--muted);margin-top:5px}
.nc-right{text-align:right}
.nc-cd{font-family:'Bebas Neue';font-size:34px;letter-spacing:2px;color:var(--safe)}
.nc-cd-sub{font-size:8px;color:var(--muted)}

/* ── UPCOMING LIST */
.upcoming-list{padding:0 12px;display:flex;flex-direction:column;gap:6px}
.up-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;transition:opacity .3s,border-color .3s}
.up-card.up-next{border-color:rgba(96,165,250,.3)}
.up-ind{width:3px;align-self:stretch;min-height:30px;border-radius:2px;flex-shrink:0;background:var(--safe)}
.up-main{flex:1;min-width:0}
.up-time{font-family:'Bebas Neue';font-size:25px;letter-spacing:2px;color:var(--white);line-height:1}
.up-sub{font-size:8px;color:var(--muted);margin-top:2px}
.up-right{text-align:right;flex-shrink:0}
.up-eta{font-size:13px;font-weight:500;color:var(--safe)}
.up-eta-sub{font-size:8px;color:var(--muted);margin-top:1px}

/* ── FIRST UPCOMING CARD — featured */
.up-card.up-featured{
  background:var(--s2);border-color:rgba(34,197,94,.3);
  border-radius:14px;padding:14px 16px;flex-direction:column;align-items:stretch;gap:0;
}
.up-featured .uf-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.up-featured .up-ind{min-height:40px}
.up-featured .up-time{font-family:'Bebas Neue';font-size:38px;letter-spacing:3px;color:var(--white);line-height:1}
.up-featured .up-right{text-align:right}
.up-featured .up-eta{font-size:16px;color:var(--safe)}
.up-featured .up-eta-sub{font-size:8px;color:var(--muted)}
.uf-push-row{
  display:flex;align-items:center;gap:8px;
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.22);
  border-radius:9px;padding:9px 12px;
}
.uf-push-icon{font-size:14px;flex-shrink:0}
.uf-push-text{flex:1}
.uf-push-label{font-size:8px;letter-spacing:2px;color:var(--warn);text-transform:uppercase;margin-bottom:2px}
.uf-push-times{font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:var(--warn)}
.uf-out-label{font-size:8px;letter-spacing:2px;color:var(--crit);text-transform:uppercase;margin-bottom:1px;margin-top:4px}
.uf-out-time{font-family:'Bebas Neue';font-size:16px;letter-spacing:2px;color:var(--crit)}

/* ── DONE LIST */
.done-list{padding:0 12px;display:flex;flex-direction:column;gap:5px}
.done-row{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;opacity:.28}
.done-ind{width:3px;min-height:26px;border-radius:2px;background:var(--done);flex-shrink:0;align-self:stretch}
.done-time{font-family:'Bebas Neue';font-size:22px;letter-spacing:2px;color:var(--muted)}
.done-badge{margin-left:auto;font-size:8px;letter-spacing:1px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:4px;text-transform:uppercase}

/* ── SHIFT COMPLETE SCREEN */
.sc-screen{
  display:none;flex-direction:column;align-items:center;
  padding:10px 20px 30px;text-align:center;
}
.sc-screen.visible{display:flex}
.sc-check{
  font-size:52px;margin-bottom:10px;
  animation:sc-pop .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sc-pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.sc-title{font-family:'Bebas Neue';font-size:36px;letter-spacing:5px;color:var(--safe);margin-bottom:4px}
.sc-sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:28px}

.sc-summary{
  width:100%;background:var(--s1);border:1px solid var(--safe-bd);
  border-radius:14px;padding:16px 20px;margin-bottom:16px;
}
.sc-summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.sc-summary-row:last-child{border-bottom:none;padding-bottom:0}
.sc-summary-lbl{font-size:9px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.sc-summary-val{font-family:'Bebas Neue';font-size:18px;letter-spacing:2px;color:var(--white)}

.sc-reset-card{
  width:100%;background:var(--s2);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;margin-bottom:16px;
}
.sc-reset-lbl{font-size:8px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.sc-reset-time{font-family:'Bebas Neue';font-size:42px;letter-spacing:3px;color:var(--blue);line-height:1;margin-bottom:2px}
.sc-reset-sub{font-size:9px;color:var(--muted)}
.sc-reset-cd{font-family:'Bebas Neue';font-size:22px;letter-spacing:2px;color:var(--text);margin-top:10px}
.sc-reset-cd-lbl{font-size:8px;color:var(--muted);letter-spacing:1px}

.sc-cpt-list{width:100%;margin-bottom:20px}
.sc-cpt-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:var(--s1);
  border:1px solid var(--border);border-radius:10px;
  margin-bottom:5px;opacity:.35;
}
.sc-cpt-dot{width:4px;height:4px;border-radius:50%;background:var(--safe);flex-shrink:0}
.sc-cpt-time{font-family:'Bebas Neue';font-size:22px;letter-spacing:2px;color:var(--muted);flex:1}
.sc-cpt-done{font-size:8px;letter-spacing:1px;color:var(--safe)}

.manual-reset-btn{
  width:100%;padding:13px;border-radius:11px;
  background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.3);
  color:var(--blue);font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;
}
.manual-reset-btn:active{transform:scale(.98);background:rgba(96,165,250,.15)}

/* ── TOAST */
.toast{position:fixed;top:12px;left:10px;right:10px;z-index:9999;background:#101c2e;border:1.5px solid;border-radius:14px;padding:13px 16px;box-shadow:0 12px 40px rgba(0,0,0,.7);animation:toast-in .28s cubic-bezier(.34,1.56,.64,1)}
.toast.warn-toast{border-color:var(--warn-bd)}
.toast.crit-toast{border-color:var(--crit-bd)}
.toast.safe-toast{border-color:var(--safe-bd)}
.toast-ttl{font-size:9px;letter-spacing:2px;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.warn-toast .toast-ttl{color:var(--warn)}
.crit-toast .toast-ttl{color:var(--crit)}
.safe-toast .toast-ttl{color:var(--safe)}
.toast-body{font-size:12px;color:var(--text)}
@keyframes toast-in{from{transform:translateY(-18px) scale(.95);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="logo">CPT <b>TRACKER</b></div>
    <div class="shift-pill">AMAZON FC</div>
  </div>

  <div class="clock-wrap">
    <div class="clock" id="clock">00:00:00</div>
    <div class="clock-date" id="clock-date">···</div>
  </div>

  <button class="notify-btn" id="notify-btn" onclick="askNotify()">🔔 Enable notifications</button>

  <!-- ── SHIFT COMPLETE SCREEN -->
  <div class="sc-screen" id="sc-screen">
    <div class="sc-check">✅</div>
    <div class="sc-title">Shift Complete</div>
    <div class="sc-sub" id="sc-sub">All CPTs finished — great work!</div>

    <div class="sc-summary" id="sc-summary"></div>

    <div class="sc-reset-card">
      <div class="sc-reset-lbl">Next shift auto-starts at</div>
      <div class="sc-reset-time">12:00 PM</div>
      <div class="sc-reset-sub">CPTs become active again automatically at noon</div>
      <div class="sc-reset-cd-lbl" style="margin-top:12px">Resets in</div>
      <div class="sc-reset-cd" id="sc-cd">--:--:--</div>
    </div>

    <div class="sc-cpt-list" id="sc-cpt-list"></div>

    <button class="manual-reset-btn" onclick="manualReset()">↺ Reset now (new shift)</button>
  </div>

  <!-- ── NORMAL SHIFT VIEW -->
  <div id="shift-view">
    <div id="active-sec" style="display:none">
      <div class="sec-hdr">⚡ Active now</div>
      <div class="active-grid" id="active-grid"></div>
    </div>

    <div id="next-sec" style="display:none">
      <div class="sec-hdr">→ Next CPT</div>
      <div id="next-wrap"></div>
    </div>

    <div id="upcoming-sec" style="display:none">
      <div class="sec-hdr">Upcoming</div>
      <div class="upcoming-list" id="upcoming-list"></div>
    </div>

    <div id="done-sec" style="display:none">
      <div class="sec-hdr">Completed</div>
      <div class="done-list" id="done-list"></div>
    </div>
  </div>

</div>

<script>
const RAW=["20:15","20:30","21:00","22:00","22:30","23:00","1:45","2:15","2:45","3:15","3:45","4:15","4:30"];

function toMin(s){const[h,m]=s.split(':').map(Number);return h*60+m}
function fmtT(m){const h=Math.floor(m/60)%24,n=m%60;return`${String(h).padStart(2,'0')}:${String(n).padStart(2,'0')}`}
function fmtCd(sec){
  if(sec<0)sec=0;
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtEta(diffMin){
  if(diffMin<60)return`${diffMin}m`;
  const h=Math.floor(diffMin/60),m=diffMin%60;
  return m?`${h}h ${m}m`:`${h}h`;
}

const CPTS=RAW.map(r=>{
  const min=toMin(r),nd=min<720,eff=nd?min+1440:min;
  return{label:fmtT(min),min,eff,pushStart:eff-70,takeOut:eff-60};
}).sort((a,b)=>a.eff-b.eff);

const manualDone=new Set();
const notified=new Set();
let notifyOn=false;
let shiftCompleteShown=false; // track if we already fired the shift-done toast

function nowEff(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  const min=h*60+m,eff=min<720?min+1440:min;
  return{eff,h,m,s,min};
}

function getPhase(cpt,effNow){
  if(manualDone.has(cpt.eff))return'done';
  const diff=cpt.eff-effNow;
  if(diff<=0)return'past';
  if(diff<=60)return'critical';
  if(diff<=70)return'warn';
  return'safe';
}

function markDone(eff){
  manualDone.add(eff);
  if('vibrate'in navigator)navigator.vibrate([80,40,80]);
  render();
}

function manualReset(){
  manualDone.clear();
  notified.clear();
  shiftCompleteShown=false;
  render();
}

/* ── NOTIFICATIONS */
function askNotify(){
  if(!('Notification'in window)){alert('Notifications not supported in this browser.');return;}
  Notification.requestPermission().then(p=>{notifyOn=p==='granted';renderNotifyBtn();});
}
function renderNotifyBtn(){
  const b=document.getElementById('notify-btn');
  if(notifyOn){b.textContent='✅ Notifications on';b.classList.add('on');}
  else{b.textContent='🔔 Enable notifications';b.classList.remove('on');}
}
function fire(title,body,type){
  showToast(title,body,type);
  if(notifyOn){try{new Notification(title,{body,silent:false});}catch(e){}}
  if('vibrate'in navigator)navigator.vibrate(type==='crit'?[500,100,500,100,900]:[300,100,300]);
}
let toastTmr;
function showToast(t,b,type){
  const old=document.getElementById('_t');if(old)old.remove();clearTimeout(toastTmr);
  const el=document.createElement('div');el.id='_t';
  el.className=`toast ${type==='crit'?'crit-toast':type==='safe'?'safe-toast':'warn-toast'}`;
  el.innerHTML=`<div class="toast-ttl">${t}</div><div class="toast-body">${b}</div>`;
  document.body.appendChild(el);
  toastTmr=setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400);},6500);
}

/* ── RENDER */
function render(){
  const{eff:effNow,h,m,s,min}=nowEff();

  /* clock */
  document.getElementById('clock').textContent=
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const d=new Date();
  const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('clock-date').textContent=`${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;

  /* categorise */
  const active  =CPTS.filter(c=>{const p=getPhase(c,effNow);return p==='warn'||p==='critical';});
  const upcoming=CPTS.filter(c=>getPhase(c,effNow)==='safe');
  const done    =CPTS.filter(c=>{const p=getPhase(c,effNow);return p==='past'||p==='done';});

  /* ── ALL DONE CHECK */
  const allDone=CPTS.every(c=>{const p=getPhase(c,effNow);return p==='past'||p==='done';});

  if(allDone){
    document.getElementById('shift-view').style.display='none';
    const sc=document.getElementById('sc-screen');
    sc.classList.add('visible');

    /* fire shift-complete toast once */
    if(!shiftCompleteShown){
      shiftCompleteShown=true;
      fire('✅ Shift Complete','All CPTs done — well done!','safe');
      if('vibrate'in navigator)navigator.vibrate([200,100,200,100,500]);
    }

    /* summary */
    const manual=CPTS.filter(c=>manualDone.has(c.eff)).length;
    const natural=done.length-manual;
    document.getElementById('sc-summary').innerHTML=`
      <div class="sc-summary-row">
        <span class="sc-summary-lbl">Total CPTs</span>
        <span class="sc-summary-val">${CPTS.length}</span>
      </div>
      <div class="sc-summary-row">
        <span class="sc-summary-lbl">Completed naturally</span>
        <span class="sc-summary-val">${natural}</span>
      </div>
      <div class="sc-summary-row">
        <span class="sc-summary-lbl">Marked done early</span>
        <span class="sc-summary-val">${manual}</span>
      </div>
    `;

    /* countdown to noon reset */
    let secsToNoon;
    if(min<720){
      /* still before noon — count down */
      secsToNoon=(720-min)*60-s;
    } else {
      /* already past noon — next reset is next day */
      secsToNoon=(720+1440-min)*60-s;
    }
    document.getElementById('sc-cd').textContent=fmtCd(secsToNoon);

    /* completed CPT list */
    const listEl=document.getElementById('sc-cpt-list');
    listEl.innerHTML='';
    CPTS.forEach(cpt=>{
      const isM=manualDone.has(cpt.eff);
      const row=document.createElement('div');
      row.className='sc-cpt-row';
      row.innerHTML=`
        <div class="sc-cpt-dot"></div>
        <div class="sc-cpt-time">${cpt.label}</div>
        <div class="sc-cpt-done">${isM?'Marked done':'✓'}</div>`;
      listEl.appendChild(row);
    });
    return;
  }

  /* normal view */
  document.getElementById('sc-screen').classList.remove('visible');
  document.getElementById('shift-view').style.display='block';
  shiftCompleteShown=false;

  /* notifications */
  CPTS.forEach(cpt=>{
    if(manualDone.has(cpt.eff))return;
    const diff=cpt.eff-effNow;
    const kw=`w${cpt.eff}`,kc=`c${cpt.eff}`,kt=`t${cpt.eff}`;
    if(diff<=70&&diff>60&&!notified.has(kw)){notified.add(kw);fire('⚠️ Start pushing',`CPT ${cpt.label} — take out by ${fmtT(cpt.takeOut%1440)}`,'warn');}
    if(diff<=60&&diff>0&&!notified.has(kc)){notified.add(kc);fire('🚨 Take out NOW',`All totes out before CPT ${cpt.label}`,'crit');}
    if(diff<=10&&diff>0&&!notified.has(kt)){notified.add(kt);fire('⏰ CPT in 10 min',`CPT ${cpt.label} departing soon`,'warn');}
  });

  /* ── ACTIVE SECTION */
  const activeSec=document.getElementById('active-sec');
  const activeGrid=document.getElementById('active-grid');
  if(active.length>0){
    activeSec.style.display='block';
    activeGrid.innerHTML='';
    const isDual=active.length>=2;
    if(isDual){
      const row=document.createElement('div');row.className='dual-row';
      active.slice(0,2).forEach(cpt=>row.appendChild(buildActiveCard(cpt,effNow,s,'dual-card')));
      activeGrid.appendChild(row);
      active.slice(2).forEach(cpt=>activeGrid.appendChild(buildActiveCard(cpt,effNow,s,'single-card')));
    } else {
      active.forEach(cpt=>activeGrid.appendChild(buildActiveCard(cpt,effNow,s,'single-card')));
    }
  } else { activeSec.style.display='none'; }

  /* ── NEXT SECTION */
  const nextSec=document.getElementById('next-sec');
  const nextWrap=document.getElementById('next-wrap');
  if(active.length===0&&upcoming.length>0){
    const nxt=upcoming[0];
    const diff=nxt.eff-effNow;
    const cdSec=diff*60-s;
    nextSec.style.display='block';
    nextWrap.innerHTML=`
      <div class="next-card">
        <div class="nc-left">
          <div class="nc-lbl">Next CPT</div>
          <div class="nc-time">${nxt.label}</div>
          <div class="nc-push">push from ${fmtT(nxt.pushStart%1440)} · out by ${fmtT(nxt.takeOut%1440)}</div>
        </div>
        <div class="nc-right">
          <div class="nc-cd">${fmtCd(cdSec)}</div>
          <div class="nc-cd-sub">until CPT</div>
        </div>
      </div>`;
  } else { nextSec.style.display='none'; }

  /* ── UPCOMING */
  const upcomingSec=document.getElementById('upcoming-sec');
  const upcomingList=document.getElementById('upcoming-list');
  const qItems=active.length>0?upcoming:upcoming.slice(1);
  if(qItems.length>0){
    upcomingSec.style.display='block';
    upcomingList.innerHTML='';
    qItems.forEach((cpt,i)=>{
      const diff=cpt.eff-effNow;
      const isNextUp=i===0&&active.length>0;
      const isFirst=i===0;
      const div=document.createElement('div');

      if(isFirst){
        /* ── Featured first card */
        div.className=`up-card up-featured${isNextUp?' up-next':''}`;
        div.innerHTML=`
          <div class="uf-top">
            <div class="up-ind" style="background:${isNextUp?'var(--blue)':'var(--safe)'}"></div>
            <div class="up-main">
              <div style="font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:2px">CPT</div>
              <div class="up-time">${cpt.label}</div>
            </div>
            <div class="up-right">
              <div class="up-eta">${fmtEta(diff)}</div>
              <div class="up-eta-sub">until CPT</div>
            </div>
          </div>
          <div class="uf-push-row">
            <div class="uf-push-icon">📦</div>
            <div class="uf-push-text">
              <div class="uf-push-label">Start pushing at</div>
              <div class="uf-push-times">${fmtT(cpt.pushStart%1440)}</div>
              <div class="uf-out-label">Take out by</div>
              <div class="uf-out-time">${fmtT(cpt.takeOut%1440)}</div>
            </div>
          </div>`;
      } else {
        /* ── Regular card */
        div.className=`up-card${isNextUp?' up-next':''}`;
        div.innerHTML=`
          <div class="up-ind" style="background:${isNextUp?'var(--blue)':'var(--safe)'}"></div>
          <div class="up-main">
            <div class="up-time">${cpt.label}</div>
            <div class="up-sub">push ${fmtT(cpt.pushStart%1440)} · out ${fmtT(cpt.takeOut%1440)}</div>
          </div>
          <div class="up-right">
            <div class="up-eta">${fmtEta(diff)}</div>
            <div class="up-eta-sub">until CPT</div>
          </div>`;
      }
      upcomingList.appendChild(div);
    });
  } else { upcomingSec.style.display='none'; }

  /* ── DONE */
  const doneSec=document.getElementById('done-sec');
  const doneList=document.getElementById('done-list');
  if(done.length>0){
    doneSec.style.display='block';
    doneList.innerHTML='';
    done.forEach(cpt=>{
      const isM=manualDone.has(cpt.eff);
      const div=document.createElement('div');
      div.className='done-row';
      div.innerHTML=`
        <div class="done-ind"></div>
        <div class="done-time">${cpt.label}</div>
        <div class="done-badge">${isM?'Done ✓':'Past'}</div>`;
      doneList.appendChild(div);
    });
  } else { doneSec.style.display='none'; }
}

function buildActiveCard(cpt,effNow,secNow,sizeClass){
  const phase=getPhase(cpt,effNow);
  const isCrit=phase==='critical';
  const diff=cpt.eff-effNow;
  let cdSec,cdSub;
  if(isCrit){cdSec=Math.max(0,diff*60-secNow);cdSub='until CPT departs';}
  else{cdSec=Math.max(0,(cpt.takeOut-effNow)*60-secNow);cdSub='until take-out time';}
  let prog=0;
  if(isCrit) prog=Math.min(100,((60-diff)/60)*100);
  else prog=Math.min(100,((10-(diff-60))/10)*100);
  const card=document.createElement('div');
  card.className=`act-card ${isCrit?'crit-card':'warn-card'} ${sizeClass}`;
  card.innerHTML=`
    <div class="phase-tag">${isCrit?'🚨 Take out':'⚠️ Push now'}</div>
    <div class="act-lbl">CPT</div>
    <div class="act-cpt-t">${cpt.label}</div>
    <div class="big-cd">${fmtCd(cdSec)}</div>
    <div class="cd-sub">${cdSub}</div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${prog.toFixed(1)}%"></div></div>
    <div class="mini-phases">
      <div class="mini-ph"><div class="mini-dot" style="background:var(--warn)"></div><div class="mini-t">${fmtT(cpt.pushStart%1440)}</div><div class="mini-desc">start pushing</div></div>
      <div class="mini-ph"><div class="mini-dot" style="background:var(--crit)"></div><div class="mini-t">${fmtT(cpt.takeOut%1440)}</div><div class="mini-desc">take it out</div></div>
      <div class="mini-ph"><div class="mini-dot" style="background:var(--blue)"></div><div class="mini-t">${cpt.label}</div><div class="mini-desc">CPT departs</div></div>
    </div>
    ${isCrit?`<button class="done-btn" onclick="markDone(${cpt.eff})">✓ Mark CPT done</button>`:''}`;
  return card;
}

render();
setInterval(render,1000);
if('Notification'in window&&Notification.permission==='granted'){notifyOn=true;renderNotifyBtn();}
</script>
</body>
</html>
